# azure-pipelines.yml — Pipeline CI/CD pour Leoni Maintenance Ticketing System

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

stages:

# ===================================================================
# STAGE 1 : CI — Build, Test, Qualité, Sécurité, Docker
# ===================================================================
- stage: CI
  displayName: 'CI - Build, Test & Quality'
  jobs:
  - job: BuildAndTest
    pool:
      name: Default
    steps:

      # ----- RÉCUPÉRATION DU CODE : HISTORIQUE GIT COMPLET -----
      # Par défaut, Azure ne récupère que le dernier commit (clone "shallow").
      # fetchDepth: 0 récupère tout l'historique :
      # - SonarCloud a l'information SCM (blame) de chaque ligne → détection fiable
      #   du "nouveau code" (plus d'avertissement "Shallow clone detected") ;
      # - Gitleaks scanne tout l'historique et attribue chaque détection au commit
      #   qui a réellement introduit la ligne (et non plus au dernier commit).
      # Le checkout "shallow" déjà présent sur l'agent est complété (--unshallow).
      - checkout: self
        fetchDepth: 0
        displayName: 'Récupérer le code (historique Git complet)'

      # ----- SONARCLOUD : PRÉPARATION (avant tout le reste) -----
      - task: SonarCloudPrepare@3
        inputs:
          SonarCloud: 'SonarCloud-Connection'
          organization: 'leoni-maintenance'
          scannerMode: 'CLI'
          configMode: 'manual'
          cliProjectKey: 'leoni-maintenance'
          cliProjectName: 'leoni-maintenance'
          # Sources = code applicatif uniquement (backend/app). Les tests sont déclarés
          # à part (sonar.tests) : sinon backend/tests était compté comme du code à
          # couvrir alors que coverage.xml (pytest --cov=app) ne mesure que app/,
          # ce qui faisait baisser la couverture du "nouveau code".
          # backend/Dockerfile est ajouté aux sources pour que SonarCloud continue
          # d'analyser l'image (utilisateur non-root, --only-binary, hashes...).
          # Un Dockerfile n'a pas de "lignes à couvrir" : la couverture ne change pas.
          # (Ne pas mettre de commentaire DANS extraProperties : ce bloc est
          # transmis tel quel au scanner comme propriétés.)
          cliSources: 'backend/app,backend/Dockerfile'
          extraProperties: |
              sonar.python.coverage.reportPaths=backend/coverage.xml
              sonar.tests=backend/tests
              sonar.python.version=3.13
        displayName: 'Préparer l''analyse SonarCloud'

      # ----- STAGE 1a : BUILD & TEST -----
      - script: python --version
        displayName: 'Vérifier Python'

      - script: |
          cd backend
          pip install -r requirements.txt
        displayName: 'Installer les dépendances'

      - script: |
          cd backend
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml
        displayName: 'Exécuter les tests unitaires et d''intégration'

      # ----- STAGE 1b : QUALITÉ & SÉCURITÉ -----
      - script: |
          cd backend
          ruff check .
        displayName: 'Analyse de qualité (Ruff)'

      - script: |
          cd backend
          bandit -r app/
        displayName: 'Scan de sécurité du code (Bandit)'

      - script: |
          C:\tools\gitleaks\gitleaks.exe detect --source . --verbose
        displayName: 'Détection de secrets (Gitleaks)'

      # ----- STAGE 1c : BUILD DES IMAGES DOCKER -----
      - script: |
          cd backend
          docker build -t leoni-maintenance-backend:$(Build.BuildId) .
        displayName: 'Construire l''image Docker (Backend)'

      - script: |
          C:\tools\trivy\trivy.exe image --severity HIGH,CRITICAL leoni-maintenance-backend:$(Build.BuildId)
        displayName: 'Scanner l''image Docker Backend (Trivy)'
        continueOnError: true

      - script: |
          cd frontend
          docker build -t leoni-maintenance-frontend:$(Build.BuildId) .
        displayName: 'Construire l''image Docker (Frontend)'

      - script: |
          C:\tools\trivy\trivy.exe image --severity HIGH,CRITICAL leoni-maintenance-frontend:$(Build.BuildId)
        displayName: 'Scanner l''image Docker Frontend (Trivy)'
        continueOnError: true

      # ----- SONARCLOUD : ANALYSE & PUBLICATION (fin du stage CI) -----
      - task: SonarCloudAnalyze@3
        displayName: 'Exécuter l''analyse SonarCloud'

      - script: |
          ping -n 21 127.0.0.1 >nul
        displayName: 'Attendre le traitement du rapport SonarCloud (20s)'

      - task: SonarCloudPublish@3
        inputs:
          pollingTimeoutSec: '300'
        displayName: 'Publier les résultats SonarCloud'
        continueOnError: true

# ===================================================================
# STAGE 2 : DEPLOY — Déploiement vers l'environnement local
# ===================================================================
- stage: Deploy
  displayName: 'Deploy to Dev-Desktop'
  dependsOn: CI
  condition: succeeded()
  jobs:
  - deployment: DeployToDesktop
    displayName: 'Déployer sur le PC local'
    pool:
      name: Default
    environment: 'Dev-Desktop'
    strategy:
      runOnce:
        deploy:
          steps:

          - script: |
              docker stop leoni-backend
              docker rm leoni-backend
            displayName: 'Arrêter l''ancien conteneur backend (si existant)'
            continueOnError: true

          - script: |
              docker run -d --name leoni-backend --restart always -p 8000:8000 -v leoni-backend-data:/data -e DATABASE_PATH=/data/leoni_maintenance.db leoni-maintenance-backend:$(Build.BuildId)
            displayName: 'Déployer le conteneur Backend'

          - script: |
              ping -n 6 127.0.0.1 >nul
              curl -f http://localhost:8000/health || exit 1
            displayName: 'Vérifier la santé du backend (health check)'

          - script: |
              docker stop leoni-frontend
              docker rm leoni-frontend
            displayName: 'Arrêter l''ancien conteneur frontend (si existant)'
            continueOnError: true

          # Image nginx-unprivileged (non-root) : nginx écoute sur 8080 dans le conteneur.
          # Le port publié sur le PC reste 8081 → URL et health check inchangés.
          - script: |
              docker run -d --name leoni-frontend --restart always -p 8081:8080 leoni-maintenance-frontend:$(Build.BuildId)
            displayName: 'Déployer le conteneur Frontend'

          - script: |
              ping -n 6 127.0.0.1 >nul
              curl -f http://localhost:8081 || exit 1
            displayName: 'Vérifier la santé du frontend (health check)'