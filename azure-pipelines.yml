# azure-pipelines.yml — Pipeline CI/CD pour Leoni Maintenance Ticketing System

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

stages:

# ===================================================================
# STAGE 1 : CI — Build, Test, Qualité, Sécurité, Docker
# ===================================================================
- stage: CI
  displayName: 'CI - Build, Test & Quality'
  jobs:
  - job: BuildAndTest
    pool:
      name: Default
    steps:

      # ----- STAGE 1a : BUILD & TEST -----
      - script: python --version
        displayName: 'Vérifier Python'

      - script: |
          cd backend
          pip install -r requirements.txt
        displayName: 'Installer les dépendances'

      - script: |
          cd backend
          pytest -v --cov=app --cov-report=term-missing
        displayName: 'Exécuter les tests unitaires et d''intégration'

      # ----- STAGE 1b : QUALITÉ & SÉCURITÉ -----
      - script: |
          cd backend
          ruff check .
        displayName: 'Analyse de qualité (Ruff)'

      - script: |
          cd backend
          bandit -r app/
        displayName: 'Scan de sécurité du code (Bandit)'

      - script: |
          C:\tools\gitleaks\gitleaks.exe detect --source . --verbose
        displayName: 'Détection de secrets (Gitleaks)'

      # ----- STAGE 1c : BUILD DES IMAGES DOCKER -----
      - script: |
          cd backend
          docker build -t leoni-maintenance-backend:$(Build.BuildId) .
        displayName: 'Construire l''image Docker (Backend)'

      - script: |
          cd frontend
          docker build -t leoni-maintenance-frontend:$(Build.BuildId) .
        displayName: 'Construire l''image Docker (Frontend)'

# ===================================================================
# STAGE 2 : DEPLOY — Déploiement vers l'environnement local
# ===================================================================
- stage: Deploy
  displayName: 'Deploy to Dev-Desktop'
  dependsOn: CI
  condition: succeeded()
  jobs:
  - deployment: DeployToDesktop
    displayName: 'Déployer sur le PC local'
    pool:
      name: Default
    environment: 'Dev-Desktop'
    strategy:
      runOnce:
        deploy:
          steps:

          - script: |
              docker stop leoni-backend
              docker rm leoni-backend
            displayName: 'Arrêter l''ancien conteneur backend (si existant)'
            continueOnError: true

          - script: |
              docker run -d --name leoni-backend --restart unless-stopped -p 8000:8000 -v leoni-backend-data:/app leoni-maintenance-backend:$(Build.BuildId)
            displayName: 'Déployer le conteneur Backend'

          - script: |
              docker stop leoni-frontend
              docker rm leoni-frontend
            displayName: 'Arrêter l''ancien conteneur frontend (si existant)'
            continueOnError: true

          - script: |
              docker run -d --name leoni-frontend --restart unless-stopped -p 8081:80 leoni-maintenance-frontend:$(Build.BuildId)
            displayName: 'Déployer le conteneur Frontend'

          - script: |
              timeout /t 5
              curl -f http://localhost:8000/health || exit 1
            displayName: 'Vérifier la santé du backend (health check)'