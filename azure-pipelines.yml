trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: Default

steps:
  # Étape de diagnostic temporaire — à supprimer une fois le problème résolu
  - script: |
      whoami
      echo %PATH%
    displayName: 'DEBUG - Vérifier utilisateur et PATH'

  - script: python --version
    displayName: 'Vérifier Python'

  - script: |
      cd backend
      pip install -r requirements.txt
    displayName: 'Installer les dépendances'

  - script: |
      cd backend
      pytest -v
    displayName: 'Exécuter les tests unitaires et d''intégration'