{{- /*
postgres-statefulset.yaml — Base PostgreSQL (1 réplique) avec stockage persistant.
StatefulSet plutôt que Deployment : identité stable (pod leoni-postgres-0) et
volume dédié créé à partir de volumeClaimTemplates (PVC data-leoni-postgres-0).

SÉCURITÉ DES DONNÉES :
- Le PVC est créé par le contrôleur StatefulSet, PAS par Helm : "helm uninstall"
  supprime le StatefulSet et son pod, mais jamais le PVC (ni donc les données).
- persistentVolumeClaimRetentionPolicy = Retain (ci-dessous) : Kubernetes ne
  supprime pas non plus le PVC quand le StatefulSet est supprimé ou réduit.
- "helm upgrade" ne touche pas le PVC ; volumeClaimTemplates est immuable :
  une modification serait refusée par l'API au lieu de recréer le volume.
- Ce qui SUPPRIME les données (StorageClass local-path, ReclaimPolicy Delete) :
  "kubectl delete pvc", la suppression du namespace, ou "k3d cluster delete".
*/ -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "leoni.postgres.fullname" . }}
  labels:
    {{- include "leoni.labels" (dict "context" . "component" "postgres" "version" .Values.postgres.image.tag) | nindent 4 }}
spec:
  # Service headless qui donne au pod un nom DNS stable
  serviceName: {{ include "leoni.postgres.fullname" . }}
  replicas: 1
  # Conserve le PVC si le StatefulSet est supprimé ou réduit (aucune perte de données)
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "leoni.selectorLabels" (dict "context" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "leoni.labels" (dict "context" . "component" "postgres" "version" .Values.postgres.image.tag) | nindent 8 }}
    spec:
      # Le pod n'appelle jamais l'API Kubernetes : pas de jeton monté
      automountServiceAccountToken: false
      # Utilisateur "postgres" (uid/gid 70) ; fsGroup rend le volume accessible au groupe 70
      securityContext:
        {{- toYaml .Values.postgres.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: {{ include "leoni.image" (dict "image" .Values.postgres.image "component" "postgres") }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            # Même Secret que le backend (jamais écrit dans le chart)
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.existingSecret }}
                  key: {{ .Values.postgres.auth.passwordKey }}
            # Données dans un SOUS-dossier du volume : initdb exige un dossier vide,
            # et la racine d'un volume peut contenir des fichiers (ex. lost+found)
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Prêt quand PostgreSQL accepte les connexions (pg_isready, sans mot de passe)
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 3
          # Démarrage : laisse jusqu'à 2 min au premier initdb avant la liveness
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 2
            failureThreshold: 60
          # Vivacité : PostgreSQL bloqué durablement → redémarrage (données conservées)
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            # Données persistantes (PVC)
            - name: data
              mountPath: /var/lib/postgresql/data
            # OBLIGATOIRE en lecture seule : socket Unix et fichier de verrou
            # (sans lui : "could not create lock file ... Read-only file system")
            - name: run
              mountPath: /var/run/postgresql
            # Précaution : fichiers temporaires éventuels
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        # Volontairement SANS le label app.kubernetes.io/instance : un outil GitOps
        # qui suit les ressources par ce label pourrait sinon considérer le PVC
        # comme "géré mais absent de Git" et proposer de le supprimer (prune).
        labels:
          app.kubernetes.io/name: {{ include "leoni.name" . }}
          app.kubernetes.io/component: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- /* Vide = StorageClass par défaut du cluster ; ne PAS écrire storageClassName: ""
               (une chaîne vide signifie "aucune classe" et bloquerait le provisionnement) */}}
        {{- with .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
