# .sonarcloud.properties — Configuration de l'analyse AUTOMATIQUE SonarCloud
# (projet herchr445_leoni-maintenance, analysé directement depuis GitHub).
#
# Pourquoi ce nom et pas sonar-project.properties :
# - l'analyse automatique SonarCloud lit UNIQUEMENT .sonarcloud.properties ;
# - le scanner du pipeline Azure DevOps (SonarCloudPrepare, configMode manual,
#   projet leoni-maintenance) lirait sonar-project.properties s'il existait et
#   fusionnerait ses valeurs avec les siennes (sources=backend) → les tests
#   seraient indexés deux fois et l'analyse Azure échouerait. Ce fichier-ci
#   est ignoré par ce scanner : aucun conflit.

# Code applicatif analysé (backend Python + frontend React)
sonar.sources=backend/app,frontend/src

# Code de test : analysé comme tests, pas compté comme code applicatif
sonar.tests=backend/tests

# Version de Python ciblée (règles et analyse adaptées à 3.13)
sonar.python.version=3.13
