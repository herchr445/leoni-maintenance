# nginx.conf — Configuration du site servi par nginx-unprivileged
# Remplace /etc/nginx/conf.d/default.conf dans l'image frontend.
#
# Cache navigateur après un déploiement (page blanche corrigée) :
# - index.html : "no-cache" → le navigateur peut le garder mais le REVALIDE à chaque
#   chargement (304 si inchangé). Sans en-tête, il le réutilisait de lui-même
#   (cache heuristique) et demandait des fichiers JS d'une ancienne version.
# - /assets/* : noms contenant un hash du contenu (ex. index-D6gYdBcX.js) → un
#   nouveau contenu a un nouveau nom : cache d'un an, "immutable".
# - /assets/* absent : vrai 404. Avant, le repli SPA renvoyait index.html (200,
#   text/html) à la place du JavaScript : le navigateur refusait de l'exécuter
#   → page blanche, et pouvait même garder cette fausse réponse en cache.

server {
    # Port 8080 : nginx tourne en non-root et ne peut pas ouvrir le port 80
    listen 8080;
    server_name _;

    # Fichiers statiques produits par "npm run build" (copiés depuis l'étape de build)
    root /usr/share/nginx/html;
    index index.html;

    # Page d'entrée de l'application : toujours revalidée auprès du serveur.
    # "/" et toutes les routes SPA aboutissent ici (redirection interne).
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Fichiers générés par Vite, nommés avec un hash de leur contenu
    location /assets/ {
        # Pas de "always" : en-tête ajouté seulement aux réponses réussies (2xx/3xx),
        # jamais à un 404
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Fichier absent → 404 (PAS de repli SPA vers index.html)
        try_files $uri =404;
        error_page 404 = @asset_missing;
    }

    # 404 d'un asset : explicitement non mis en cache (pendant un rolling update,
    # un fichier peut manquer quelques secondes sur un pod de l'autre version)
    location @asset_missing {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location / {
        # Repli SPA (Single Page Application) : si le fichier demandé n'existe pas
        # (ex : /tickets/3, une "page" gérée par React côté navigateur), on sert
        # index.html (via location = /index.html, donc avec no-cache) ; React
        # affiche alors la bonne vue.
        try_files $uri $uri/ /index.html;
    }
}
